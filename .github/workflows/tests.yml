---
name: 'Program in cmd dir CI Test'

on:
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/tests.yml'
      - '.github/workflows/ci.yml'
      - '.reuse/*'
      - 'command/**'
      - 'command/cmd/foo/**'
      - 'library/**'
      - 'program/**'
      - 'README.md'

  pull_request:
  workflow_dispatch:

# The release job in ci.yml declares these, and a called workflow can't ask
# for more than its caller grants.  Nothing is pushed or published.
permissions:
  contents:      write
  pull-requests: read
  packages:      write

jobs:
  command:
    # Normally don't use a workflow without the @{ref}.  In this case, we want
    # to run the workflow specified by the branch instead of what is associated
    # with a reference so we can test that the change works.
    uses: ./.github/workflows/ci.yml
    with:
      license-skip:         true
      release-skip-publish: --skip-publish
      working-directory:    command
      release-main-package: ./cmd/foo
      release-type:         program
      release-docker:       true
      release-docker-file:  ./cmd/foo/Dockerfile
    secrets: inherit

  command-release:
    uses: ./.github/workflows/ci.yml
    with:
      release-simulate-tag: v1.0.${{ github.run_number }}
      copyright-skip:       true
      build-skip:           true
      lint-skip:            true
      license-skip:         true
      style-skip:           true
      release-skip-publish: --skip-publish
      working-directory:    command
      release-main-package: ./cmd/foo
      release-binary-name:  foo
      release-type:         program
      release-docker:       true
      release-docker-file:  ./cmd/foo/Dockerfile
      release-docker-latest: true
      release-docker-major:  true
      release-docker-minor:  true
    secrets: inherit

  program:
    uses: ./.github/workflows/ci.yml
    with:
      license-skip:          true
      release-skip-publish:  --skip-publish
      working-directory:     program
      release-type:          program
      release-docker:        true
      release-docker-extras: |
        main.go
    secrets: inherit

  program-release:
    uses: ./.github/workflows/ci.yml
    with:
      release-simulate-tag: v1.0.${{ github.run_number }}
      copyright-skip:         true
      build-skip:             true
      lint-skip:              true
      license-skip:           true
      style-skip:             true
      release-skip-publish:   --skip-publish
      release-binary-name:    programtest
      working-directory:      program
      release-type:           program
      release-docker:         true
      release-docker-latest:  true
      release-docker-major:   true
      release-docker-minor:   true
      release-docker-extras:  |
        main.go
        go.mod
    secrets: inherit

  library:
    uses: ./.github/workflows/ci.yml
    with:
      license-skip:         true
      release-skip-publish: --skip-publish
      working-directory:    library
      release-type:         library
      release-project-name: library
    secrets: inherit

  library-release:
    uses: ./.github/workflows/ci.yml
    with:
      release-simulate-tag: v1.0.${{ github.run_number }}
      copyright-skip:       true
      build-skip:           true
      lint-skip:            true
      license-skip:         true
      style-skip:           true
      release-skip-publish: --skip-publish
      working-directory:    library
      release-type:         library
      release-project-name: library
    secrets: inherit

  slow-things:
    uses: ./.github/workflows/ci.yml
    with:
      working-directory:    program
      release-type:         program
      release-project-name: program
      release-skip-publish: --skip-publish
      yaml-lint-skip:       false
    secrets: inherit

  slow-things-library:
    uses: ./.github/workflows/ci.yml
    with:
      working-directory:    library
      release-type:         library
      release-project-name: library
      release-skip-publish: --skip-publish
    secrets: inherit
